<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-title" content="AegisTrans" />
    <meta name="application-name" content="AegisTrans" />
    <meta name="description" content="AegisTrans - 跨裝置自己對自己的訊息與檔案同步工具" />

    <!-- CSP: scripts/styles stay same-origin. connect-src allows any HTTPS/WSS endpoint because the
         user picks the AegisTrans server at runtime (Settings → Server); plain http/ws only for localhost dev. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob:;
      connect-src 'self' https: wss: blob: http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:*;
      media-src 'self' blob:;
      worker-src 'self' blob:;
      font-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " />

    <!-- PWA -->
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>AegisTrans 安心傳</title>

    <!-- Inline theme script: prevents flash of wrong theme before React loads -->
    <script>
      (function() {
        var STORAGE_KEY = 'aegistrans_theme';
        var mode = 'system';
        try { mode = localStorage.getItem(STORAGE_KEY) || 'system'; } catch(e) {}
        var isDark = mode === 'dark' ||
          (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(isDark ? 'dark' : 'light');
      })();
    </script>

  </head>
  <body>
    <jeep-sqlite wasmpath=""></jeep-sqlite>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
